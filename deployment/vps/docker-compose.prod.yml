name: oneself-prod

services:
  caddy:
    image: caddy:2-alpine
    container_name: oneself-caddy-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN:-admin.localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@oneself.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - front
      - dashboard
      - server
    networks:
      - oneself_network

  server:
    image: ${IMAGE_REPOSITORY:?Set IMAGE_REPOSITORY to ghcr.io/owner/repo}-server:${IMAGE_TAG:?Set IMAGE_TAG to the deployed commit SHA}
    container_name: oneself-server-prod
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI:-${DB_URL:-mongodb://host.docker.internal:27017/oneself}}
      DB_URL: ${DB_URL:-${MONGODB_URI:-mongodb://host.docker.internal:27017/oneself}}
      CLIENT_SIDE_URL: https://${DOMAIN_NAME:-localhost}
      MAIN_DOMAIN: https://${DOMAIN_NAME:-localhost}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      UPLOAD_PLATFORM: ${UPLOAD_PLATFORM:-local}
    volumes:
      - server_uploads:/app/apps/server/uploads
    networks:
      - oneself_network

  front:
    image: ${IMAGE_REPOSITORY:?Set IMAGE_REPOSITORY to ghcr.io/owner/repo}-front:${IMAGE_TAG:?Set IMAGE_TAG to the deployed commit SHA}
    container_name: oneself-front-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      - server
    networks:
      - oneself_network

  dashboard:
    image: ${IMAGE_REPOSITORY:?Set IMAGE_REPOSITORY to ghcr.io/owner/repo}-dashboard:${IMAGE_TAG:?Set IMAGE_TAG to the deployed commit SHA}
    container_name: oneself-dashboard-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
    depends_on:
      - server
    networks:
      - oneself_network

volumes:
  server_uploads:
  caddy_data:
  caddy_config:

networks:
  oneself_network:
    driver: bridge
