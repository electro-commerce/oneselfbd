name: oneself-prod

services:
  caddy:
    image: caddy:2-alpine
    container_name: oneself-caddy-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN:-admin.localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@oneself.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - front
      - dashboard
      - server
    networks:
      - oneself_network

  mongo:
    image: mongo:7-jammy
    container_name: oneself-mongo-prod
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-oneself}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-oneself_secret_pass}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-oneself}
    volumes:
      - mongo_prod_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oneself_network

  server:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    container_name: oneself-server-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME:-oneself}:${MONGO_INITDB_ROOT_PASSWORD:-oneself_secret_pass}@mongo:27017/${MONGO_INITDB_DATABASE:-oneself}?authSource=admin
      CLIENT_SIDE_URL: https://${DOMAIN_NAME:-localhost}
      MAIN_DOMAIN: https://${DOMAIN_NAME:-localhost}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      UPLOAD_PLATFORM: ${UPLOAD_PLATFORM:-local}
    volumes:
      - server_uploads:/app/apps/server/uploads
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - oneself_network

  front:
    build:
      context: ../..
      dockerfile: apps/front/Dockerfile
    container_name: oneself-front-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_BASE_API_URL: https://${DOMAIN_NAME:-localhost}/api/v1
      NEXT_PUBLIC_APP_URL: https://${DOMAIN_NAME:-localhost}
    depends_on:
      - server
    networks:
      - oneself_network

  dashboard:
    build:
      context: ../..
      dockerfile: apps/dashboard/Dockerfile
    container_name: oneself-dashboard-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_BASE_API_URL: https://${DOMAIN_NAME:-localhost}/api/v1
    depends_on:
      - server
    networks:
      - oneself_network

volumes:
  mongo_prod_data:
  server_uploads:
  caddy_data:
  caddy_config:

networks:
  oneself_network:
    driver: bridge
