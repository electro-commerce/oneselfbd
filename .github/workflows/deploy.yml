name: CI/CD Deployment

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ==============================================================================
  # Job 1: Build & Verify (Runs on GitHub Actions Runner)
  # ==============================================================================
  build-and-verify:
    name: Build & Verify Monorepo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Workspace & Root
        run: pnpm lint:all

      - name: Typecheck Applications
        run: pnpm typecheck

      - name: Build Applications
        run: pnpm build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker Builds
        run: |
          echo "Verifying Docker build for apps/server..."
          docker build -t oneself-server:verify -f apps/server/Dockerfile .

          echo "Verifying Docker build for apps/front..."
          docker build -t oneself-front:verify -f apps/front/Dockerfile .

          echo "Verifying Docker build for apps/dashboard..."
          docker build -t oneself-dashboard:verify -f apps/dashboard/Dockerfile .

  # ==============================================================================
  # Job 2: Deploy to VPS (Runs after build and verification succeed)
  # ==============================================================================
  deploy-to-vps:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    needs: [build-and-verify]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            APP_DIR="${{ secrets.VPS_PROJECT_PATH || '/opt/oneself' }}"

            echo "=== Starting Oneself Deployment ==="
            echo "Deploying branch: ${{ github.ref_name }}"
            echo "Deploying commit: ${{ github.sha }}"

            # Ensure application directory exists
            if [ ! -d "$APP_DIR" ]; then
              echo "Error: Directory $APP_DIR does not exist on the VPS."
              exit 1
            fi

            cd "$APP_DIR"

            # Fetch and sync latest code
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

            # Navigate to deployment directory and update stack
            cd deployment/vps

            echo "Building and launching containers..."
            docker compose -f docker-compose.prod.yml pull --ignore-buildable || true
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            echo "Pruning dangling images..."
            docker image prune -f --filter "until=24h"

            echo "=== Deployment Successfully Completed ==="
            docker compose -f docker-compose.prod.yml ps
