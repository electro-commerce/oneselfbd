name: CI/CD Deployment

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-verify:
    name: Build & Verify Monorepo
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Workspace & Root
        run: pnpm lint:all

      - name: Typecheck Applications
        run: pnpm typecheck

      - name: Prepare production frontend configuration
        env:
          FRONT_ENV: ${{ vars.FRONT_ENV_PRODUCTION || secrets.FRONT_ENV_PRODUCTION }}
          DASHBOARD_ENV: ${{ vars.DASHBOARD_ENV_PRODUCTION || secrets.DASHBOARD_ENV_PRODUCTION }}
        run: |
          python3 - <<'PYENV'
          import os
          from pathlib import Path
          for app, name in [('front', 'FRONT_ENV'), ('dashboard', 'DASHBOARD_ENV')]:
              content = os.environ[name]
              if not content.strip():
                  raise SystemExit(f'Missing Actions variable or secret: {name}_PRODUCTION')
              path = Path('apps') / app / '.env.production.local'
              path.touch(mode=0o600)
              path.write_text(content + '\n')
          PYENV

      - name: Build Applications
        run: pnpm build

      - name: Clean production frontend configuration
        if: always()
        run: rm -f apps/front/.env.production.local apps/dashboard/.env.production.local

  build-images:
    name: Build & Publish ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: [build-and-verify]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [server, front, dashboard]
        include:
          - app: front
            env_name: FRONT_ENV_PRODUCTION
          - app: dashboard
            env_name: DASHBOARD_ENV_PRODUCTION
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare frontend build environment
        if: matrix.app != 'server'
        id: frontend-env
        env:
          ENV_CONTENT: ${{ vars[matrix.env_name] || secrets[matrix.env_name] }}
          ENV_CONFIG_NAME: ${{ matrix.env_name }}
          APP_NAME: ${{ matrix.app }}
        run: |
          if [ -z "$ENV_CONTENT" ]; then
            echo "::error::Missing required Actions variable or secret: $ENV_CONFIG_NAME"
            exit 1
          fi
          python3 - <<'PYENV'
          import os, re
          keys = set(re.findall(r'^\s*(NEXT_PUBLIC_\w+)\s*=', os.environ['ENV_CONTENT'], re.M))
          prefix = 'NEXT_PUBLIC_FRONT_' if os.environ['APP_NAME'] == 'front' else 'NEXT_PUBLIC_'
          required = {prefix + 'NODE_ENV', prefix + 'API_BASE_URL'}
          missing = required - keys
          if missing:
              raise SystemExit('Missing build environment variables: ' + ', '.join(sorted(missing)))
          if os.environ['APP_NAME'] == 'front':
              match = re.search(r'^\s*NEXT_PUBLIC_FRONT_GTM_ID\s*=\s*["\']?(GTM-[A-Z0-9]+)["\']?\s*$', os.environ['ENV_CONTENT'], re.M)
              if not match:
                  raise SystemExit('Missing or invalid NEXT_PUBLIC_FRONT_GTM_ID in FRONT_ENV_PRODUCTION')
              legacy = {key for key in keys if not key.startswith(prefix)}
              if legacy:
                  raise SystemExit('Rename storefront variables to NEXT_PUBLIC_FRONT_: ' + ', '.join(sorted(legacy)))
          PYENV
          umask 077
          ENV_FILE="$RUNNER_TEMP/frontend.env"
          printf '%s\n' "$ENV_CONTENT" > "$ENV_FILE"
          echo "secret-file=frontend_env=$ENV_FILE" >> "$GITHUB_OUTPUT"
          ENV_HASH="$(sha256sum "$ENV_FILE" | cut -d ' ' -f 1)"
          echo "build-args=FRONTEND_ENV_HASH=$ENV_HASH" >> "$GITHUB_OUTPUT"

      - name: Set image repository
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "repository=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          secret-files: ${{ steps.frontend-env.outputs.secret-file }}
          build-args: ${{ steps.frontend-env.outputs.build-args }}
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.repository }}-${{ matrix.app }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: Clean frontend environment file
        if: always() && matrix.app != 'server'
        run: rm -f "$RUNNER_TEMP/frontend.env"

  deploy-to-vps:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    needs: [build-images]
    permissions:
      contents: read
      packages: read
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          envs: GHCR_TOKEN,GHCR_USERNAME,IMAGE_REPOSITORY,IMAGE_TAG
          command_timeout: 20m
          script: |
            set -e
            APP_DIR="${{ secrets.VPS_PROJECT_PATH || '/opt/oneself' }}"

            echo "=== Starting Oneself Deployment ==="
            echo "Deploying branch: ${{ github.ref_name }}"
            echo "Deploying commit: ${{ github.sha }}"

            # Ensure application directory exists
            if [ ! -d "$APP_DIR" ]; then
              echo "Error: Directory $APP_DIR does not exist on the VPS."
              exit 1
            fi

            cd "$APP_DIR"

            # Fetch and sync latest code
            git fetch origin ${{ github.ref_name }}
            git checkout --detach "$IMAGE_TAG"

            # Navigate to deployment directory and update stack
            cd deployment/vps

            # Use the same lowercase repository name as the image build jobs.
            export IMAGE_REPOSITORY="$(printf '%s' "$IMAGE_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
            export IMAGE_TAG

            # Keep the short-lived registry token out of the VPS's persistent config.
            export DOCKER_CONFIG="$(mktemp -d)"
            trap 'rm -rf "$DOCKER_CONFIG"' EXIT
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
            unset GHCR_TOKEN

            echo "Pulling prebuilt images..."
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --no-build --remove-orphans --wait --wait-timeout 600

            # Discard product data captured during the image build before reporting success.
            echo "Invalidating storefront build-time cache..."
            docker compose -f docker-compose.prod.yml exec -T front node -e '
              fetch("http://127.0.0.1:3000/api/revalidate", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  authorization: "Bearer " + process.env.REVALIDATE_SECRET
                },
                body: JSON.stringify({ all: true }),
                signal: AbortSignal.timeout(15000)
              }).then(async response => {
                if (!response.ok || (await response.json()).revalidated !== true) {
                  throw new Error("Storefront revalidation failed: HTTP " + response.status);
                }
              }).catch(error => { console.error(error.message); process.exit(1); });
            '

            # The landing page requires a server-only product ID list at runtime.
            # Fail the deployment if the storefront silently renders without its order form.
            docker compose -f docker-compose.prod.yml exec -T front node -e '
              fetch("http://127.0.0.1:3000/steps/smart-pir-motion-sensor-led-bulb", {
                signal: AbortSignal.timeout(30000)
              }).then(async response => {
                const html = await response.text();
                if (!response.ok || !html.includes("pir-landing-payment")) {
                  throw new Error("PIR landing checkout is unavailable: HTTP " + response.status);
                }
              }).catch(error => { console.error(error.message); process.exit(1); });
            '

            # Save the deployed image selection for subsequent manual Compose commands.
            printf 'IMAGE_REPOSITORY=%s\nIMAGE_TAG=%s\n' "$IMAGE_REPOSITORY" "$IMAGE_TAG" > .env.images

            # Run only after the updated stack passes Compose's readiness checks.
            # Commit-tagged images need --all; dangling-only pruning retains them.
            # Docker retains images referenced by existing containers.
            echo "Removing unused Docker images..."
            docker image prune --all --force

            echo "=== Deployment Successfully Completed ==="
            docker compose -f docker-compose.prod.yml ps
