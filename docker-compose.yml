name: oneself

services:
  mongo:
    image: mongo:7-jammy
    container_name: oneself-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-oneself}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-oneself_secret_pass}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-oneself}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: oneself-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME:-oneself}:${MONGO_INITDB_ROOT_PASSWORD:-oneself_secret_pass}@mongo:27017/${MONGO_INITDB_DATABASE:-oneself}?authSource=admin
      CLIENT_SIDE_URL: ${CLIENT_SIDE_URL:-http://localhost:3000}
      MAIN_DOMAIN: ${MAIN_DOMAIN:-http://localhost:3000}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-oneself_dev_access_token_secret_key_12345}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-oneself_dev_refresh_token_secret_key_12345}
      UPLOAD_PLATFORM: ${UPLOAD_PLATFORM:-local}
    volumes:
      - server_uploads:/app/apps/server/uploads
    depends_on:
      mongo:
        condition: service_healthy

  front:
    build:
      context: .
      dockerfile: apps/front/Dockerfile
    container_name: oneself-front
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_BASE_API_URL: ${NEXT_PUBLIC_BASE_API_URL:-http://localhost:5000/api/v1}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    depends_on:
      - server

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    container_name: oneself-dashboard
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_BASE_API_URL: ${NEXT_PUBLIC_BASE_API_URL:-http://localhost:5000/api/v1}
    depends_on:
      - server

volumes:
  mongo_data:
  server_uploads:
