name: oneself

services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: oneself-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI:-mongodb://host.docker.internal:27017/your_database}
      DB_URL: ${DB_URL:-${MONGODB_URI:-mongodb://host.docker.internal:27017/your_database}}
      CLIENT_SIDE_URL: ${CLIENT_SIDE_URL:-http://localhost:3000}
      MAIN_DOMAIN: ${MAIN_DOMAIN:-localhost}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-oneself_dev_access_token_secret_key_12345}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-oneself_dev_refresh_token_secret_key_12345}
      UPLOAD_PLATFORM: ${UPLOAD_PLATFORM:-local}
    volumes:
      - server_uploads:/app/apps/server/uploads

  front:
    build:
      context: .
      dockerfile: apps/front/Dockerfile
    container_name: oneself-front
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      - server

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    container_name: oneself-dashboard
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
    depends_on:
      - server

volumes:
  server_uploads:
